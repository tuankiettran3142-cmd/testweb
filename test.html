<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Website đầu tiên</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f5ff;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #2563eb;
            color: white;
            padding: 25px;
        }

        .content {
            padding: 80px 20px;
        }

        h1 {
            font-size: 45px;
            color: #1e3a8a;
        }

        p {
            font-size: 20px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <header>
        <h2>MY AI PROJECT</h2>
    </header>

    <div class="content">
        <h1>Xin chào 👋</h1>

        <p>
            Đây là website đầu tiên của tôi!
        </p>

        <button>
            Bắt đầu
        </button>
    </div>

</body>
</html>
